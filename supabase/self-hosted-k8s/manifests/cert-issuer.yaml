apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: supabase-selfsigned
  namespace: supabase
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: supabase-tls
  namespace: supabase
spec:
  secretName: supabase-tls
  commonName: supabase.local
  dnsNames:
    - supabase.local
  issuerRef:
    name: supabase-selfsigned
    kind: Issuer
