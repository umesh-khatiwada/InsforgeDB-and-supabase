# Example Helm values for Bitnami PostgreSQL
# Customize storageClass, resources, and credentials for production
image:
  tag: "16.2-debian-12"  # Pinned version instead of rolling 'latest'
global:
  postgresql:
    postgresqlPassword: p5sW0rdX9Gh7Kq2LmV4zTt
    postgresqlDatabase: supabase
    postgresqlUsername: supabase
primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
metrics:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  serviceMonitor:
    enabled: false
