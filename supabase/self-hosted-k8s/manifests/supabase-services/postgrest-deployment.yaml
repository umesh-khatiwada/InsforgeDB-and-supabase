apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: supabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:latest
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: POSTGRES_URI
            - name: PGRST_DB_SCHEMA
              value: "public"
            - name: PGRST_DB_ANON_ROLE
              value: "anon"
            - name: PGRST_DB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: POSTGREST_JWT_SECRET
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
