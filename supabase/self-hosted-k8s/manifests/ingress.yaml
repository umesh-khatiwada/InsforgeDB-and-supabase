apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-ingress
  namespace: supabase
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/issuer: "supabase-selfsigned"
spec:
  tls:
    - hosts:
        - supabase.local
      secretName: supabase-tls
  rules:
    - host: supabase.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gotrue
                port:
                  number: 9999
          - path: /rest
            pathType: Prefix
            backend:
              service:
                name: postgrest
                port:
                  number: 3000
          - path: /realtime
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  number: 4000
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: storage
                port:
                  number: 8080
